<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Reverie &ndash; Manage Uploads</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="icon" href="/static/icon-192.png" />
  <link rel="apple-touch-icon" href="/static/icon-192.png" />
  <link rel="stylesheet" href="/static/reverie-list-page.css?v=56" />
  <link rel="stylesheet" href="/static/reverie-website.css?v=56" media="(min-width: 920px) and (hover: hover) and (pointer: fine)" />
</head>
<body class="uploads-page">
  <div class="shell">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/" aria-label="Reverie Home">
          <div class="brand-mark"><img src="/static/logo_reverie.webp?v=56" alt="Reverie" /></div>
          <div class="brand-copy">
            <h1 class="brand-name">Reverie</h1>
            <p class="brand-line">Remember better.</p>
          </div>
        </a>
        <nav class="nav" aria-label="Primary">
          <a href="/">Home</a>
          <a href="/search">Search</a>
          <a href="/tasks">Tasks</a>
          <a class="active" href="/account">Account</a>
        </nav>
        <div class="status"><span class="status-dot"></span> Uploads</div>
      </div>
    </header>

    <main class="page uploads-content">
      <section class="panel uploads-hero">
        <div class="panel-head">
          <div>
            <div class="section-kicker">Manage Uploads</div>
            <h2>Images and Documents</h2>
            <p class="panel-subtitle">Remove uploaded files while keeping the memory item, summary, tags, and notes.</p>
          </div>
          <a class="account-return" href="/account">Back to Account</a>
        </div>
        <div class="entity-status" id="uploadsStatus">Loading...</div>
      </section>

      <section class="panel uploads-list-panel">
        <div class="entity-list-head">
          <strong>Uploaded Files</strong>
          <span id="uploadsCount">0 items</span>
        </div>
        <div class="uploads-list" id="uploadsList"></div>
        <div class="entity-empty hidden" id="uploadsEmpty">No uploaded images or documents found.</div>
      </section>
    </main>
  </div>

  <script src="/static/reverie-shared.js?v=56" defer></script>
  <script src="/static/reverie-uploads.min.js?v=56" defer></script>
  <nav class="mobile-tabbar" aria-label="Mobile primary">
    <a href="/" aria-label="Home"><span class="tab-icon">&#8962;</span><span>Home</span></a>
    <a href="/search" aria-label="Search"><span class="tab-icon">&#8981;</span><span>Search</span></a>
    <a href="/tasks" aria-label="Tasks"><span class="tab-icon">&#10003;</span><span>Tasks</span></a>
    <a class="active" href="/account" aria-label="Account"><span class="tab-icon">&#9881;</span><span>Account</span></a>
  </nav>
</body>
</html>
