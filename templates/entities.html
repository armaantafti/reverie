<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Reverie &ndash; Manage Entities</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="icon" href="/static/icon-192.png" />
  <link rel="apple-touch-icon" href="/static/icon-192.png" />
  <link rel="stylesheet" href="/static/reverie-list-page.css?v=19" />
</head>
<body class="entities-page">
  <div class="shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-mark"><img src="/static/logo_reverie.png" alt="Reverie" /></div>
          <div class="brand-copy">
            <h1 class="brand-name">Reverie</h1>
            <p class="brand-line">Remember better.</p>
          </div>
        </div>
        <nav class="nav" aria-label="Primary">
          <a href="/">Home</a>
          <a href="/search">Search</a>
          <a href="/tasks">Tasks</a>
          <a href="/recommendations">Recommendations</a>
        </nav>
        <div class="status"><span class="status-dot"></span> Entities</div>
      </div>
    </header>

    <main class="page entity-page">
      <section class="panel entity-toolbar-panel">
        <div class="panel-head">
          <div>
            <div class="section-kicker">Manage Entities</div>
            <p class="panel-subtitle">Clean up names, entities, and tags used across memories.</p>
          </div>
        </div>
        <div class="entity-tabs" role="tablist" aria-label="Entity type">
          <button class="active" data-kind="person" type="button">People</button>
          <button data-kind="entity" type="button">Entities</button>
          <button data-kind="tag" type="button">Tags</button>
        </div>
        <div class="entity-search-row">
          <input id="entitySearch" class="search-input" type="search" placeholder="Search names, aliases, or tags" autocomplete="off" />
          <select id="entitySort" class="search-input">
            <option value="count">Most used</option>
            <option value="az">A-Z</option>
            <option value="aliases">Has aliases</option>
            <option value="single">Single-use</option>
          </select>
        </div>
        <div class="entity-filters">
          <button class="active" data-filter="all" type="button">All</button>
          <button data-filter="duplicates" type="button">Likely duplicates</button>
          <button data-filter="aliases" type="button">Has aliases</button>
          <button data-filter="single" type="button">Single-use</button>
        </div>
        <div class="entity-status" id="entityStatus">Loading...</div>
      </section>

      <section class="entity-layout">
        <article class="panel entity-list-panel">
          <div class="entity-list-head">
            <strong id="entityListTitle">People</strong>
            <span id="entityListCount">0 items</span>
          </div>
          <div class="entity-list" id="entityList"></div>
          <div class="entity-empty hidden" id="entityEmpty">Nothing matched this view.</div>
        </article>

        <aside class="panel entity-action-panel">
          <div class="section-kicker">Selection</div>
          <div class="entity-selection-summary" id="entitySelectionSummary">Select one or more items.</div>
          <label class="status-label" for="entityTarget">Canonical / new value</label>
          <input id="entityTarget" class="search-input" type="text" placeholder="Final name, tag, or entity" />
          <div class="entity-action-grid">
            <button class="btn btn-primary" id="entityMerge" type="button">Merge selected</button>
            <button class="btn btn-secondary" id="entityRename" type="button">Rename one</button>
            <button class="btn btn-secondary" id="entityCreate" type="button">Create new</button>
            <button class="btn btn-danger" id="entityDelete" type="button">Delete selected</button>
          </div>
          <div class="entity-impact" id="entityImpact">No changes selected.</div>
        </aside>
      </section>
    </main>
  </div>

  <script src="/static/reverie-shared.js?v=19"></script>
  <script src="/static/reverie-entities.js?v=19"></script>
  <a class="mobile-fab" href="/#capturePanel" aria-label="Capture memory">+</a>
  <nav class="mobile-tabbar" aria-label="Mobile primary">
    <a href="/" aria-label="Home"><span class="tab-icon">&#8962;</span><span>Home</span></a>
    <a href="/search" aria-label="Search"><span class="tab-icon">&#8981;</span><span>Search</span></a>
    <a href="/tasks" aria-label="Tasks"><span class="tab-icon">&#10003;</span><span>Tasks</span></a>
    <a class="active" href="/entities" aria-label="Account"><span class="tab-icon">&#9881;</span><span>Account</span></a>
  </nav>
</body>
</html>
