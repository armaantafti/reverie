<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Reverie &ndash; Recommendations</title>
  <link rel="stylesheet" href="/static/reverie-list-page.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-mark"><img src="/static/logo_reverie.png" alt="Reverie" /></div>
          <div class="brand-copy">
            <h1 class="brand-name">Reverie</h1>
            <p class="brand-line">Remember better.</p>
          </div>
        </div>
        <nav class="nav" aria-label="Primary">
          <a href="/">Home</a>
          <a href="/tasks">Tasks</a>
          <a class="active" href="/recommendations">Recommendations</a>
        </nav>
        <div class="status"><span class="status-dot"></span> Ready</div>
      </div>
    </header>

    <main class="page">
      <section class="stack">
        <article class="panel">
          <div class="panel-head">
            <div class="section-kicker">Recommendations</div>
          </div>
          <div class="note-grid" id="recsRecentList">
            <div class="note-card" id="recsRecentEmpty" style="cursor:default;">
              <h4 class="note-title">No recent recommendations</h4>
            </div>
          </div>
        </article>

        <article class="panel">
          <div class="panel-head">
            <div class="section-kicker">Earlier</div>
          </div>
          <div class="note-grid" id="recsPastList">
            <div class="note-card" id="recsPastEmpty" style="cursor:default;">
              <h4 class="note-title">No earlier recommendations</h4>
            </div>
          </div>
        </article>
      </section>
    </main>

    <div class="modal-backdrop" id="recsModal" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="recsDetailTitle">
        <div class="modal-head">
          <div>
            <h3 class="modal-title" id="recsDetailTitle"></h3>
            <p class="modal-sub" id="recsDetailSub"></p>
          </div>
          <button class="modal-close" id="recsCloseBtn" type="button" aria-label="Close">&#10005;</button>
        </div>
        <div class="detail-grid">
          <div class="detail-block">
            <span class="detail-label">Summary</span>
            <div class="detail-value" id="recsDetailSummary"></div>
          </div>
          <div class="detail-block">
            <span class="detail-label">Raw note</span>
            <div class="detail-value" id="recsDetailRaw"></div>
          </div>
          <div class="detail-block">
            <span class="detail-label">Tags</span>
            <div class="chips" id="recsDetailTags"></div>
          </div>
          <div class="detail-block">
            <span class="detail-label">Person</span>
            <div class="detail-value" id="recsDetailPerson"></div>
          </div>
          <div class="detail-block">
            <span class="detail-label">Time</span>
            <div class="detail-value" id="recsDetailTime"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" id="recsContextBackdrop" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="recsContextTitle">
        <div class="modal-head">
          <div>
            <h3 class="modal-title" id="recsContextTitle"></h3>
            <p class="modal-sub" id="recsContextSub"></p>
          </div>
          <button class="modal-close" id="recsContextClose" type="button" aria-label="Close">&#10005;</button>
        </div>
        <div class="context-list" id="recsContextList"></div>
      </div>
    </div>

    <div class="modal-backdrop" id="recsStatusBackdrop" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="recsStatusTitle">
        <div class="modal-head">
          <div>
            <h3 class="modal-title" id="recsStatusTitle">Update status</h3>
            <p class="modal-sub" id="recsStatusSub"></p>
          </div>
          <button class="modal-close" id="recsStatusClose" type="button" aria-label="Close">&#10005;</button>
        </div>
        <div class="status-modal-form">
          <div class="status-field">
            <label class="status-label" for="recsStatusSelect">Status</label>
            <select id="recsStatusSelect" class="status-select">
              <option value="pending">Pending</option>
              <option value="completed">Completed</option>
              <option value="skipped">Skipped</option>
            </select>
          </div>
          <div class="status-field">
            <label class="status-label" for="recsStatusNote">Add a brief update (optional)</label>
            <textarea id="recsStatusNote" class="status-note" placeholder="What changed?"></textarea>
          </div>
          <div class="status-actions">
            <button class="btn btn-secondary" id="recsStatusCancel" type="button">Cancel</button>
            <button class="btn btn-primary" id="recsStatusSave" type="button">Save</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/reverie-list-page.js"></script>
  <script>
    initReverieListPage({
      primary: {
        listId: "recsRecentList",
        emptyId: "recsRecentEmpty",
        emptyText: "No recent recommendations",
      },
      secondary: {
        listId: "recsPastList",
        emptyId: "recsPastEmpty",
        emptyText: "No earlier recommendations",
      },
      signedOutText: "Sign in on Home to view recommendations",
      detail: {
        backdropId: "recsModal",
        closeId: "recsCloseBtn",
        titleId: "recsDetailTitle",
        subId: "recsDetailSub",
        summaryId: "recsDetailSummary",
        rawId: "recsDetailRaw",
        tagsId: "recsDetailTags",
        personId: "recsDetailPerson",
        timeId: "recsDetailTime",
      },
      context: {
        backdropId: "recsContextBackdrop",
        closeId: "recsContextClose",
        titleId: "recsContextTitle",
        subId: "recsContextSub",
        listId: "recsContextList",
      },
      status: {
        backdropId: "recsStatusBackdrop",
        closeId: "recsStatusClose",
        cancelId: "recsStatusCancel",
        saveId: "recsStatusSave",
        titleId: "recsStatusTitle",
        subId: "recsStatusSub",
        selectId: "recsStatusSelect",
        noteId: "recsStatusNote",
      },
      splitNotes(notes) {
        const recs = notes
          .filter((note) => String(note?.note_type || "").toLowerCase() === "recommendation")
          .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));

        const primary = [];
        const secondary = [];
        recs.forEach((note) => {
          const status = String(note?.status || "pending").toLowerCase();
          if (status === "completed") secondary.push(note);
          else primary.push(note);
        });

        return {
          primary,
          secondary,
        };
      },
    });
  </script>
</body>
</html>
