<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Reverie &ndash; Profile</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="icon" href="/static/icon-192.png" />
  <link rel="apple-touch-icon" href="/static/icon-192.png" />
  <link rel="stylesheet" href="/static/reverie-list-page.css?v=59" />
  <link rel="stylesheet" href="/static/reverie-website.css?v=59" media="(min-width: 920px) and (hover: hover) and (pointer: fine)" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-mark"><img src="/static/logo_reverie.webp?v=59" alt="Reverie" /></div>
          <div class="brand-copy">
            <h1 class="brand-name">Reverie</h1>
            <p class="brand-line">Remember better.</p>
          </div>
        </div>
        <nav class="nav" aria-label="Primary">
          <a href="/">Home</a>
          <a href="/search">Search</a>
          <a href="/tasks">Tasks</a>
          <a class="active" href="/account">Account</a>
        </nav>
        <div class="status"><span class="status-dot"></span> Profile</div>
      </div>
    </header>

    <main class="page">
      <section class="stack">
        <article class="panel">
          <div class="panel-head compact-page-head">
            <a class="back-link" href="/account" aria-label="Back to account">&#8249;</a>
            <div>
              <div class="section-kicker">Profile</div>
              <h2 class="page-title">Personal details</h2>
              <p class="panel-subtitle">Update the details Reverie uses for profile display, reminders, and voice preferences.</p>
            </div>
          </div>

          <div class="profile-card profile-detail-card" id="profileCard">
            <div class="profile-avatar profile-avatar-large" id="profileAvatar">R</div>
            <div class="profile-copy">
              <h3 id="profileDisplayName">Loading profile...</h3>
              <p id="profileEmail">Checking account details</p>
              <div class="profile-meta">
                <span id="profileProvider">Login method</span>
                <span id="profileTimezone">Timezone</span>
                <span id="profileLanguage">Language</span>
              </div>
            </div>
          </div>

          <form class="profile-form" id="profileForm">
            <div class="profile-form-grid">
              <label class="profile-field">
                <span>Display name</span>
                <input id="profileNameInput" name="display_name" type="text" autocomplete="name" placeholder="Your name" />
              </label>
              <label class="profile-field">
                <span>Phone number</span>
                <input id="profilePhoneInput" name="phone_number" type="tel" autocomplete="tel" placeholder="Optional" />
              </label>
              <label class="profile-field">
                <span>Timezone</span>
                <input id="profileTimezoneInput" name="timezone" type="text" autocomplete="off" placeholder="Asia/Kolkata" />
              </label>
              <label class="profile-field">
                <span>Preferred language</span>
                <input id="profileLanguageInput" name="preferred_language" type="text" autocomplete="off" placeholder="English" />
              </label>
            </div>
            <div class="profile-actions">
              <button class="btn btn-primary" id="profileSaveBtn" type="submit">Save Profile</button>
              <span class="account-action-status" id="profileStatus" aria-live="polite"></span>
            </div>
          </form>
        </article>
      </section>
    </main>
  </div>

  <script src="/static/reverie-shared.js?v=59" defer></script>
  <script src="/static/reverie-account.js?v=59" defer></script>
  <nav class="mobile-tabbar" aria-label="Mobile primary">
    <a href="/" aria-label="Home"><span class="tab-icon">&#8962;</span><span>Home</span></a>
    <a href="/search" aria-label="Search"><span class="tab-icon">&#8981;</span><span>Search</span></a>
    <a href="/tasks" aria-label="Tasks"><span class="tab-icon">&#10003;</span><span>Tasks</span></a>
    <a class="active" href="/account" aria-label="Account"><span class="tab-icon">&#9881;</span><span>Account</span></a>
  </nav>
</body>
</html>
